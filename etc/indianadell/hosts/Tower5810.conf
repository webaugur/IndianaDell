# Tower5810 profile: reproduces the settings tuned on 2026-10-27..31.
# Loaded automatically when `hostname -s` is Tower5810 (before /etc/indianadell/tuning.conf and env vars).
# Computed defaults for 16 GB would be: zram 12G, ARC 4 GiB, Chrome 5G/6G.
ZRAM_SIZE=13G
ARC_MAX_GIB=4
CHROME_HIGH=5G
CHROME_MAX=6G
LOGIN_USER=user
# fast-login (GDM auto-login) was applied by hand on Tower5810; opt in here so status checks it.
ENABLE_FAST_LOGIN=1
