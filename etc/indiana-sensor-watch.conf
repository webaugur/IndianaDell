# IndianaDell sensor watchdog — override any of these.
# Installed to /etc/indiana-sensor-watch.conf by bin/apply-sensor-watch.

POLL_SEC=20
SMART_SEC=300
NOTIFY_SEC=300
STEP_SEC=40
RELEASE_HOLD_SEC=90

WARN_CPU=80
CRIT_CPU=90
CPU_RELEASE=72
CPU_FLOOR_KHZ=1600000
CPU_ABS_MIN_KHZ=1200000
CPU_STEP_KHZ=200000

WARN_GPU=80
CRIT_GPU=90
GPU_RELEASE=72
# Display GPU (W5100) never below this pp_dpm_sclk index (690 MHz).
GPU_DISPLAY_MIN_IDX=2
# Headless W5100 floor (550 MHz).
GPU_HEADLESS_MIN_IDX=1

WARN_DIMM=70
CRIT_DIMM=85
WARN_SSD=60
CRIT_SSD=70
WARN_HDD=50
CRIT_HDD=60

WARN_CPU_FAN_RPM=400
# Unused HDD_FAN header on this chassis (dell_smm fan2 == 0).
IGNORE_FANS=fan2

# Rise alerts even below the absolute cap.
RISE_20S=6
RISE_60S=10

# PI on (temp - target). Small gains; output is quantized to one ladder step.
KP=0.25
KI=0.02

THROTTLE=1
THROTTLE_CPU=1
