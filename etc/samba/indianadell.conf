# IndianaDell — ZFS /home SMB on Tower5810 (B1GMB42)
# Applied by scripts/samba/apply-zfs-smb.sh
#
# Dataset: rpool/USERDATA/home_ulmkkv → /home  (user + ubuntu)
# Do not inherit sharesmb onto rpool/USERDATA or root_ulmkkv.
#
# bind interfaces only requires loopback so smbd can talk to itself.
# Bind the LAN IPv4 only (not the NIC name): enp0s25 also has a global IPv6.
# Do not bind virbr0 or docker0. If 10.0.0.113 changes, edit this and re-apply.

[global]
   interfaces = 10.0.0.113 127.0.0.1
   bind interfaces only = yes
   map to guest = never
   usershare allow guests = no
   usershare max shares = 100
   # Do NOT template from the live [home] share: Samba 4.23.6 SIGSEGV in
   # load_usershare_service on iPad TCON (see /var/log/samba/log.mobile).
   usershare template share = zfs-usershare-template
   usershare owner only = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # iOS Files.app treats the share as read-only without fruit (AAPL).
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:resource = stream
   fruit:nfs_aces = no
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:encoding = native
   smb3 unix extensions = no

# available=no: used only as usershare defaults (writable). Not a client share.
[zfs-usershare-template]
   path = /home
   available = no
   browseable = no
   read only = no
   writable = yes
   guest ok = no
   valid users = user
   force user = user

# Friendly name. ZFS sharesmb also publishes rpool_USERDATA_home_ulmkkv.
[home]
   comment = ZFS rpool/USERDATA/home_ulmkkv
   path = /home
   browseable = yes
   read only = no
   writable = yes
   valid users = user
   force user = user
   create mask = 0644
   directory mask = 0755
   guest ok = no

[Documents]
   comment = /home/user/Documents
   path = /home/user/Documents
   browseable = yes
   read only = no
   writable = yes
   valid users = user
   force user = user
   create mask = 0644
   directory mask = 0755
   guest ok = no
